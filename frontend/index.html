<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>پیش‌بینی قیمت خانه</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f0f8ff, #e6f7ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
    }
    .card {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-radius: 15px;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
    }
    #result {
      font-size: 1.2em;
      font-weight: bold;
      color: #006400;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card p-4" style="width: 420px;">
    <h3 class="text-center mb-4">🏠 پیش‌بینی قیمت خانه در تهران</h3>

    <form id="predictForm">
      <div class="mb-3">
        <label class="form-label">متراژ (متر مربع)</label>
        <input type="number" class="form-control" id="area" required>
      </div>

      <div class="mb-3">
        <label class="form-label">تعداد اتاق‌ها</label>
        <input type="number" class="form-control" id="rooms" required>
      </div>

      <button type="button" id="predict-btn" class="btn btn-primary w-100">پیش‌بینی کن</button>
    </form>

    <div id="result" class="text-center"></div>
  </div>

  <script>
  document.getElementById('predict-btn').addEventListener('click', async () => {
      const area = parseFloat(document.getElementById('area').value);
      const rooms = parseInt(document.getElementById('rooms').value);

      const data = {
          "Area": area,
          "Rooms": rooms
      };

      try {
          const response = await fetch('http://127.0.0.1:8000/api/predict/', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
          });

          const result = await response.json();
          document.getElementById('result').innerText =
              `قیمت پیش‌بینی‌شده: ${result.predicted_price.toLocaleString()} تومان`;
      } catch (error) {
          document.getElementById('result').innerText = 'خطا در ارتباط با سرور 😢';
          console.error(error);
      }
  });
  </script>
</body>
</html>
